# Checks every pull request before it can merge (make "python" and
# "frontend" required status checks in the main-branch ruleset).
#
# pull_request, never pull_request_target: a pull request's code runs with a
# read-only token and no secrets.
name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    # The nightly data commits change nothing these checks look at.
    paths-ignore:
      - 'hashes.json'
      - 'health.json'
      - 'history.json'
      - 'runs.jsonl'
      - 'analysis/**'
      - 'diffs/**'
      - 'snapshots/**'
      - 'logs/**'
      - 'news/**'
      - 'transparency/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (hash-checked)
        run: python -m pip install --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check

      - name: Type-check
        run: mypy

      - name: Test
        run: python -m unittest discover -s tests

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --require-hashes --disable-pip -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only what ships to readers' browsers; the build toolchain's own
      # advisories are tracked by Dependabot.
      - name: Audit shipped dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true
          GENERATE_SOURCEMAP: false
