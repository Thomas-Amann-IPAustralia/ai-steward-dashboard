# .github/workflows/update_checker.yml
name: Check for Updates, Build, and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'policy_sets.json'
      - 'steward_config.yaml'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # The gates that stop false alerts are only worth having if they are
    # checked. These run without a network, a browser or an API key.
    - name: Run pipeline tests
      run: python -m unittest discover -s tests -v

    # Chrome is the fallback path only — URLs marked "render": true in
    # policy_sets.json, and salvaging a plain fetch that came back unusable.
    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Run update script
      id: run_script
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PROXY_HOST: ${{ secrets.PROXY_HOST }}
        PROXY_PORT: ${{ secrets.PROXY_PORT }}
        PROXY_USER: ${{ secrets.PROXY_USER }}
        PROXY_PASS: ${{ secrets.PROXY_PASS }}
      run: python main.py

    - name: Commit and push if changed
      id: commit_push
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        mkdir -p analysis snapshots diffs logs
        git add analysis/ snapshots/ diffs/ policy_sets.json
        for f in hashes.json health.json history.json runs.jsonl; do
          if [ -f "$f" ]; then git add "$f"; fi
        done
        git add -f logs/

        if git diff --staged --quiet; then
          echo "No content changes detected by the script."
          echo "changes_detected=false" >> $GITHUB_OUTPUT
        else
          git commit -m "Update content snapshots and analysis [$(date +'%Y-%m-%d %H:%M:%S UTC')]"
          git pull --rebase
          git push
          echo "Content changes committed and pushed."
          echo "changes_detected=true" >> $GITHUB_OUTPUT
        fi

    # Silent failure was the default: a source could rot unnoticed for months
    # while the dashboard kept showing its last known state as if it were
    # current. One issue per degraded run, reusing the run's own health report.
    - name: Raise a health issue
      if: hashFiles('health_alert.md') != ''
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('health_alert.md', 'utf8');
          const title = `Steward health: sources need attention (${new Date().toISOString().slice(0, 10)})`;

          const existing = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'source-health',
          });

          const footer = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';

          if (existing.data.length > 0) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.data[0].number,
              body: body + footer,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: body + footer,
              labels: ['source-health'],
            });
          }

    - name: Fail the run if the update script failed
      if: steps.run_script.outcome == 'failure'
      run: |
        echo "::error::main.py exited non-zero. Artefacts produced before the failure were still committed."
        exit 1

    - name: Setup Node.js
      if: steps.commit_push.outputs.changes_detected == 'true' || github.event_name == 'push'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node.js dependencies
      if: steps.commit_push.outputs.changes_detected == 'true' || github.event_name == 'push'
      run: |
        npm ci || (echo "npm ci failed, falling back to npm install" && npm install)

    - name: Run frontend tests
      if: steps.commit_push.outputs.changes_detected == 'true' || github.event_name == 'push'
      run: npm test -- --watchAll=false --passWithNoTests
      env:
        CI: true

    - name: Build React app
      if: steps.commit_push.outputs.changes_detected == 'true' || github.event_name == 'push'
      run: npm run build
      env:
        CI: true
        GENERATE_SOURCEMAP: false

    - name: Copy data files to build directory
      if: steps.commit_push.outputs.changes_detected == 'true' || github.event_name == 'push'
      run: |
        echo "Copying data files to build directory..."
        mkdir -p build/analysis build/snapshots build/diffs build/logs
        cp hashes.json build/
        cp policy_sets.json build/
        for f in health.json history.json; do
          if [ -f "$f" ]; then cp "$f" build/; fi
        done
        cp -r analysis/. build/analysis/ 2>/dev/null || echo "No analysis files to copy"
        cp -r snapshots/. build/snapshots/ 2>/dev/null || echo "No snapshot files to copy"
        cp -r diffs/. build/diffs/ 2>/dev/null || echo "No diff files to copy"
        # Only the archived analyses ship, not the archived snapshots. The
        # timeline reads history.json and fetches an analysis on demand; the
        # snapshots were ~13 MB of the ~14 MB and nothing ever fetched them.
        find logs -maxdepth 1 -name '*_analysis.json' -exec cp {} build/logs/ \; 2>/dev/null || true
        find logs -maxdepth 1 -name '*_diff.txt' -exec cp {} build/logs/ \; 2>/dev/null || true
        du -sh build/logs || true

    - name: Setup Pages
      if: steps.commit_push.outputs.changes_detected == 'true' || github.event_name == 'push'
      uses: actions/configure-pages@v4

    - name: Upload artifact
      if: steps.commit_push.outputs.changes_detected == 'true' || github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: './build'

    - name: Deploy to GitHub Pages
      if: steps.commit_push.outputs.changes_detected == 'true' || github.event_name == 'push'
      id: deployment
      uses: actions/deploy-pages@v4
