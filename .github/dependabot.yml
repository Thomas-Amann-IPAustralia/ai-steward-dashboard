# Weekly update pull requests, grouped so a normal week is one PR per
# ecosystem. Security updates are raised as soon as an advisory is published,
# whatever this schedule says, once "Dependabot security updates" is on in
# Settings -> Code security.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
